name: chromium-x64-manual
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted, linux, x64, chromium-builder]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Verify builder capacity
        run: |
          test "$(uname -m)" = x86_64
          test "$(df --output=avail -k . | tail -1)" -ge 209715200
      - run: scripts/bootstrap_source.sh
      - run: scripts/apply_patches.sh
      - run: scripts/build_linux_x64.sh
      - run: scripts/test_all.sh
