name: chromium-x64-manual
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted, linux, x64, chromium-builder]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Verify builder capacity
        run: |
          test "$(uname -m)" = x86_64
          test "$(df --output=avail -k . | tail -1)" -ge 209715200
      - name: Prepare and build pinned Chromium
        run: scripts/setup-x64-builder.sh --build
      - name: Run Aegis host-capable suite
        run: scripts/test_all.sh
