name: Build Aegis Browser x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Aegis
        uses: actions/checkout@v4

      - name: Liberar espaço
        run: |
          echo "ANTES:"
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          echo "DEPOIS:"
          df -h /

      - name: Instalar dependências básicas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            file \
            git \
            lld \
            lsb-release \
            pkg-config \
            python3 \
            python3-venv \
            rsync \
            unzip \
            xz-utils

      - name: Instalar depot_tools
        run: |
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Ler versão do Chromium
        id: chromium
        run: |
          VERSION="$(tr -d '[:space:]' < CHROMIUM_VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chromium: $VERSION"

      - name: Preparar checkout
        run: |
          export PATH="$HOME/depot_tools:$PATH"

          mkdir -p "$HOME/chromium"
          cd "$HOME/chromium"

          fetch --nohooks --no-history chromium

      - name: Fixar versão do Chromium
        run: |
          export PATH="$HOME/depot_tools:$PATH"

          cd "$HOME/chromium/src"

          git fetch --depth=1 origin \
            tag "${{ steps.chromium.outputs.version }}" || \
          git fetch --depth=1 origin \
            "${{ steps.chromium.outputs.version }}"

          git checkout --detach \
            "${{ steps.chromium.outputs.version }}"

      - name: Sincronizar dependências
        run: |
          export PATH="$HOME/depot_tools:$PATH"

          cd "$HOME/chromium"

          gclient sync \
            --no-history \
            --nohooks \
            --with_branch_heads

      - name: Instalar dependências do Chromium
        run: |
          cd "$HOME/chromium/src"
          sudo ./build/install-build-deps.sh --no-prompt

      - name: Executar hooks
        run: |
          export PATH="$HOME/depot_tools:$PATH"

          cd "$HOME/chromium"
          gclient runhooks

      - name: Aplicar patches do Aegis
        run: |
          cd "$HOME/chromium/src"

          while IFS= read -r patch; do
            [ -z "$patch" ] && continue

            case "$patch" in
              \#*) continue ;;
            esac

            echo "Aplicando $patch"

            git am \
              "$GITHUB_WORKSPACE/patches/$patch"
          done < "$GITHUB_WORKSPACE/patches/series"

      - name: Gerar build GN
        run: |
          export PATH="$HOME/depot_tools:$PATH"

          cd "$HOME/chromium/src"

          mkdir -p out/Aegis

          cp \
            "$GITHUB_WORKSPACE/build/args.gn" \
            out/Aegis/args.gn

          gn gen out/Aegis

          echo "Espaço restante:"
          df -h /

      - name: Compilar Aegis
        run: |
          export PATH="$HOME/depot_tools:$PATH"

          cd "$HOME/chromium/src"

          autoninja \
            -C out/Aegis \
            -j2 \
            chrome

      - name: Empacotar
        run: |
          cd "$HOME/chromium/src/out/Aegis"

          tar -czf \
            "$GITHUB_WORKSPACE/aegis-linux-x64.tar.gz" \
            chrome \
            chrome_sandbox \
            icudtl.dat \
            resources.pak \
            locales

      - name: Enviar build
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Linux-x64
          path: aegis-linux-x64.tar.gz
          retention-days: 7
